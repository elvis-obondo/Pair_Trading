# The live paper system on the VM.
#
# THE VM NEVER BUILDS. Images are built on the laptop for linux/amd64 and pushed
# to Artifact Registry; the VM only pulls. Building here cost 4.6GB of build
# cache on a disk with 8GB free, ran pip for seven minutes on 2 shared vCPU, and
# put OOM risk on the one machine whose job is to never miss a stop.
#
#   scripts/release.sh          build, push, deploy
#   scripts/release.sh --build  build and push only
#
# ONE-TIME SETUP before the first `up`:
#   mkdir -p trading_data/scan_history trading_data/monitor_ticks logs
#   touch trading_data/scanner_trades.csv
# Docker bind-mounts a missing FILE path as an empty directory rather than
# erroring, so pre-creating the CSV as a real file avoids that footgun.
#
# WHY THE BOOK IS BIND-MOUNTED: equity is re-summed from scanner_trades.csv on
# every start. Lose the ledger and every subsequent position is mis-sized.
services:
  # Long-lived. Owns the book: opens, closes, sizing, state file, ledger.
  # It is the ONLY writer of scanner_trades.csv and scanner_state.json, and it
  # holds an exclusive lock so a second copy cannot start.
  stop-monitor:
    image: us-central1-docker.pkg.dev/project-0671be06-e22a-44d8-83c/pairs-trading/stop-monitor:latest
    container_name: pairs-stop-monitor
    restart: unless-stopped
    command: ["python", "research/stop_monitor.py"]
    volumes:
      - ./trading_data:/app/trading_data
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Single-shot, and only used in FULL mode where the scanner also runs on the
  # VM. In micro mode the scanner runs on the laptop and ships its candidates
  # over, so this never starts -- `profiles` keeps `up -d` from launching it.
  scanner:
    image: us-central1-docker.pkg.dev/project-0671be06-e22a-44d8-83c/pairs-trading/stop-monitor:latest
    container_name: pairs-scanner
    profiles: ["oneshot"]
    command: ["python", "research/live_scanner.py", "--no-refresh"]
    volumes:
      - ./trading_data:/app/trading_data
      - ./logs:/app/logs
      - ./user_data/data:/app/user_data/data
      - ./user_data/normalized:/app/user_data/normalized
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
